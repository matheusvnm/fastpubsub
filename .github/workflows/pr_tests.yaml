name: Quality Checks
on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened

env:
  UV_LINK_MODE: "copy"
  UV_FROZEN: "1"

jobs:
  lints:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv command
        uses: astral-sh/setup-uv@v7
      - name: Install the Rust toolchain from rust-toolchain.toml
        working-directory: fastpubsub-core
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fastpubsub-core
      - name: Install dependencies and build the core
        run: uv sync --group lint --group bench
      - name: Check typing rules
        run: uv run mypy fastpubsub benchmarks
      - name: Check linting rules
        run: uv run ruff check fastpubsub tests docs/snippets benchmarks fastpubsub-core/tests
      - name: Check formatting rules
        run: uv run ruff format --check fastpubsub tests docs/snippets benchmarks fastpubsub-core/tests
      - name: Check docstrings
        run: uv run docstr-coverage fastpubsub --exclude "__about__" --verbose 1
      - name: Check the core stub
        run: uv run python -m mypy.stubtest fastpubsub_core --allowlist fastpubsub-core/stubtest-allowlist.txt
      - name: Check misspellings
        run: uv run codespell fastpubsub
      - name: Check for vulnerabilities
        run: uv run bandit -c pyproject.toml -r fastpubsub

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastpubsub-core
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fastpubsub-core
      - name: Install the Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      - name: Check formatting rules
        run: cargo fmt --all --check
      - name: Check linting rules
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check documentation
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Start Pub/Sub emulator
        working-directory: .
        run: docker compose up --detach --wait pubsub
      - name: Run tests
        run: cargo nextest run --workspace --all-features --locked --no-tests=pass
        env:
          PUBSUB_EMULATOR_HOST: "localhost:8085"
      - name: Run doctests
        run: cargo test --doc --workspace --locked
      - name: Stop Pub/Sub emulator
        if: always()
        working-directory: .
        run: docker compose down --volumes
      - name: Check dependencies
        run: cargo deny check
      - name: Check unused dependencies
        run: cargo machete

  core-msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastpubsub-core
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Read the minimum supported Rust version
        run: |
          echo "RUST_VERSION=$(grep -m1 '^rust-version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_ENV"
      - name: Install the toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fastpubsub-core
      - name: Check the build
        run: cargo +"$RUST_VERSION" check --workspace --all-features --locked

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      PUBSUB_EMULATOR_HOST: "localhost:8085"
      CLOUDSDK_CORE_PROJECT: "fastpubsub-test-project"
      PYTHONPATH: "docs/snippets"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv command
        uses: astral-sh/setup-uv@v7
      - name: Install the Rust toolchain from rust-toolchain.toml
        working-directory: fastpubsub-core
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fastpubsub-core
      - name: Install dependencies and build the core
        run: uv sync --group test
      - name: Start Pub/Sub emulator
        run: docker compose up --detach --wait pubsub
      - name: Run tests with coverage
        run: |
          uv run pytest \
            -n auto \
            --cov=fastpubsub \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=80
      - name: Stop Pub/Sub emulator
        if: always()
        run: docker compose down --volumes

  tests-free-threaded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14t", "3.15t"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      PUBSUB_EMULATOR_HOST: "localhost:8085"
      CLOUDSDK_CORE_PROJECT: "fastpubsub-test-project"
      PYTHONPATH: "docs/snippets"
      PYTHON_GIL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv command
        uses: astral-sh/setup-uv@v7
      - name: Install the Rust toolchain from rust-toolchain.toml
        working-directory: fastpubsub-core
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fastpubsub-core
      - name: Install dependencies and build the core
        run: uv sync --no-default-groups --group test --group bench
      - name: Start Pub/Sub emulator
        run: docker compose up --detach --wait pubsub
      - name: Run tests with the GIL disabled
        run: .venv/bin/python -m pytest -n auto
      - name: Stop Pub/Sub emulator
        if: always()
        run: docker compose down --volumes
