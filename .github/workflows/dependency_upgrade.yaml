name: Dependency Upgrade

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv command
        uses: astral-sh/setup-uv@v7
      - name: Upgrade locked dependencies
        run: uv lock --upgrade
      - name: Check for lock file changes
        id: lock
        run: |
          if git diff --quiet uv.lock; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump patch version
        if: steps.lock.outputs.has_changes == 'true'
        id: version
        run: |
          uv version --bump patch
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        if: steps.lock.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
          branch: upgrade/dependencies
          delete-branch: true
          commit-message: "build(deps): upgrade dependencies and bump version to ${{ steps.version.outputs.version }}"
          title: "build(deps): upgrade dependencies and bump version to ${{ steps.version.outputs.version }}"
          body: |
            Weekly upgrade of the locked dependencies (`uv lock --upgrade`).
            Bumps the project version to `${{ steps.version.outputs.version }}`.
            The merge to `main` creates the tag `v${{ steps.version.outputs.version }}` and publishes the release.
          labels: dependencies
