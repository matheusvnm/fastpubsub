name: Create New Release (PyPI)

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      should_publish_core: ${{ steps.core.outputs.should_publish_core }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv command
        uses: astral-sh/setup-uv@v7
      - name: Read project version
        id: version
        run: echo "tag=v$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Create tag and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG exists. No new release."
            echo "should_publish=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check if PyPI has the core version
        id: core
        run: |
          core_version=$(uv version --short --package fastpubsub-core)
          if curl --silent --fail --output /dev/null "https://pypi.org/pypi/fastpubsub-core/$core_version/json"; then
            echo "PyPI has fastpubsub-core $core_version. No new core release."
            echo "should_publish_core=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish_core=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.should_publish == 'true'
    uses: ./.github/workflows/build_wheels.yaml
    with:
      ref: ${{ needs.tag.outputs.tag }}

  publish-core:
    needs: [tag, build]
    if: needs.tag.outputs.should_publish == 'true' && needs.tag.outputs.should_publish_core == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-core
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install uv command
        uses: astral-sh/setup-uv@v7
      - name: Download the core wheels and sdist
        uses: actions/download-artifact@v8
        with:
          pattern: core-*
          path: dist/core
          merge-multiple: true
      - name: Publish fastpubsub-core
        run: uv publish --trusted-publishing always dist/core/*

  publish:
    needs: [tag, build, publish-core]
    if: >-
      !cancelled()
      && needs.tag.outputs.should_publish == 'true'
      && needs.build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.publish-core.result)
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install uv command
        uses: astral-sh/setup-uv@v7
      - name: Download the fastpubsub package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist/package
      - name: Publish fastpubsub
        run: uv publish --trusted-publishing always dist/package/*
