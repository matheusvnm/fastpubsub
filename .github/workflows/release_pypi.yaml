name: Create New Release (PyPI)

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv command
        uses: astral-sh/setup-uv@v7
      - name: Read project version
        id: version
        run: echo "tag=v$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Create tag and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG exists. No new release."
            echo "should_publish=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.should_publish == 'true'
    uses: ./.github/workflows/build_wheels.yaml
    with:
      ref: ${{ needs.tag.outputs.tag }}

  publish:
    needs: [tag, build]
    if: needs.tag.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install uv command
        uses: astral-sh/setup-uv@v7
      - name: Download the core wheels and sdist
        uses: actions/download-artifact@v8
        with:
          pattern: core-*
          path: dist/core
          merge-multiple: true
      - name: Download the fastpubsub package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist/package
      - name: Publish fastpubsub-core
        run: uv publish --trusted-publishing always dist/core/*
      - name: Publish fastpubsub
        run: uv publish --trusted-publishing always dist/package/*
