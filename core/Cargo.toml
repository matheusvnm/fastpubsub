[package]
name = "fastpubsub-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
name = "fastpubsub_core"
crate-type = ["cdylib"]

[dependencies]
google-cloud-auth = "1"
google-cloud-gax = "1.15"
google-cloud-pubsub = "1.7.0"
wkt = { version = "1.10", package = "google-cloud-wkt" }
pyo3 = { version = "0.30", features = ["extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py312"]

[profile.release]
lto = "fat"
codegen-units = 1
