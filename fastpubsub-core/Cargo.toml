[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
fastpubsub-google-pubsub = { path = "crates/google-pubsub" }
fastpubsub-messaging = { path = "crates/messaging" }
bytes = "1"
futures = "0.3"
google-cloud-auth = "1"
google-cloud-gax = "1.15"
google-cloud-pubsub = "1.7.0"
pyo3 = "0.30"
thiserror = "2"
tokio = "1"
wkt = { version = "1.10", package = "google-cloud-wkt" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
doc_markdown = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
